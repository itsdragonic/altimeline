<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altimeline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ebe7d8;
            color: black;
            font-family: 'Times New Roman', Times, serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 600px;
        }

        h1 {
            font-size: clamp(3rem, 10vw, 6rem);
            margin-bottom: 0.5rem;
            font-weight: normal;
            letter-spacing: 0.05em;
        }

        .author {
            font-size: clamp(1rem, 3vw, 1.5rem);
            color: #666;
            margin-bottom: 3rem;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        .game-button {
            background-color: transparent;
            color: black;
            border: 2px solid black;
            padding: 1rem 3rem;
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            font-family: 'Times New Roman', Times, serif;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            min-width: 200px;
        }

        .game-button:hover {
            background-color: black;
            color: #ebe7d8;
        }

        .game-button:active {
            transform: scale(0.98);
        }

        @media (max-width: 480px) {
            .author {
                margin-bottom: 2rem;
            }
            
            .game-button {
                min-width: 150px;
                padding: 0.8rem 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Altimeline</h1>
        <div class="author">by Dragonic</div>
        <div class="button-container">
            <a href="globe.html" class="game-button">Play</a>
        </div>
    </div>
</body>
</html>
