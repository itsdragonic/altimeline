<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Crop Tool</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 5px;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        h1 {
            color: #333;
            text-shadow: 2px 2px 2px rgba(0, 0, 0, 0.2);
            text-align: center;
            margin-bottom: 1px;
        }

        h2 {
            color: #666;
            text-align: center;
            font-size: 1.2em;
            margin-bottom: 20px;
        }

        canvas {
            display: none;
        }
    </style>
</head>
<body>
    <h1>Auto-Crop Tool</h1>
    <h2>Auto-crops inputted images in base64</h2>

    <input type="file" id="fileInput" onchange="handleFileInput(event)">
    <canvas id="canvas"></canvas>

    <script src="image.js"></script>
    <script src="crop.js"></script>
</body>
</html>
